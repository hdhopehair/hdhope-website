<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HD Hope｜設計師後台</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f3ef;
      color: #333;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .card {
      width: min(90%, 420px);
      padding: 40px 30px;
      background: #fff;
      border: 1px solid #e5e1db;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.05);
    }

    h1 {
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #message {
      margin-top: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .success { color: #28794c; }
    .error { color: #b63c3c; }
  </style>
</head>

<body>
  <main class="card">
    <h1>HD HOPE</h1>
    <p class="subtitle">STYLIST PORTAL</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="電子郵件"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="密碼"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        設計師登入
      </button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../admin/config.js"></script>

  <script>
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

   const config = window.HD_CONFIG;

  if (!config || !config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
      message.textContent = "尚未完成 Supabase 連線設定";
      message.className = "error";
    } else {
const client = window.supabase.createClient(
  config.SUPABASE_URL,
  config.SUPABASE_ANON_KEY,
        {
          auth: {
            storageKey: "hdhope-stylist-auth"
          }
        }
      );

      document.getElementById("loginForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          button.disabled = true;
          message.textContent = "正在登入...";
          message.className = "";

          try {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const { data, error } =
              await client.auth.signInWithPassword({
                email,
                password
              });

            if (error) throw error;

            const { data: account, error: accountError } =
              await client
                .from("stylist_accounts")
                .select("stylist_id")
                .eq("user_id", data.user.id)
                .single();

            if (accountError || !account) {
              await client.auth.signOut();
              throw new Error("此帳號尚未綁定設計師身分");
            }

            message.textContent =
              "登入成功！設計師身分驗證完成。";

            message.className = "success";

            document.getElementById("loginForm").hidden = true;
            // 讀取目前登入設計師的個人資料
const { data: myProfile, error: profileError } = await client
  .from("stylists")
  .select("id, name, title, paragraphs, philosophy, experience, specialties, instagram_url, line_url")
  .eq("id", account.stylist_id)
  .single();

if (profileError) {
  message.textContent =
    "❌ 個人資料讀取失敗：" + profileError.message;
  message.className = "error";
} else {
  message.textContent =
    "✅ 個人資料讀取成功：" + (myProfile.name || "未填姓名");
  message.className = "success";
}
            // 顯示設計師自己的作品
const worksPanel = document.createElement("section");
worksPanel.style.marginTop = "24px";

const worksTitle = document.createElement("h2");
worksTitle.textContent = "我的作品集";
worksPanel.appendChild(worksTitle);

const worksList = document.createElement("div");
worksList.textContent = "正在載入作品...";
worksPanel.appendChild(worksList);

message.after(worksPanel);

// ===== 設計師個人資料編輯 =====
if (!profileError && myProfile) {
  const profilePanel = document.createElement("section");
  profilePanel.style.marginTop = "30px";

  profilePanel.innerHTML = `
    <h2>編輯我的個人資料</h2>

    <form id="profileForm">
    <p>
  <label for="profileIntroduction">自我介紹</label>
  <textarea
    id="profileIntroduction"
    rows="5"
    placeholder="介紹自己、服務風格，以及希望帶給顧客的感受"
  ></textarea>
</p>

<p>
  <label for="profileSpecialties">擅長技術</label>
  <textarea
    id="profileSpecialties"
    rows="3"
    placeholder="例如：霧感染髮、特殊色、縮毛矯正（請用逗號分隔）"
  ></textarea>
</p>
      <p>
        <label for="profilePhilosophy">設計理念</label>
        <textarea id="profilePhilosophy" rows="4"></textarea>
      </p>

      <p>
        <label for="profileExperience">工作經歷</label>
        <textarea id="profileExperience" rows="3"></textarea>
      </p>

      <p>
        <label for="profileInstagram">Instagram 連結</label>
        <input id="profileInstagram" type="url">
      </p>

      <p>
        <label for="profileLine">LINE 預約連結</label>
        <input id="profileLine" type="url">
      </p>

      <button id="saveProfileBtn" type="submit">
        儲存個人資料
      </button>
    </form>

    <p id="profileSaveMessage" role="status"></p>
  `;

  worksPanel.before(profilePanel);
// 載入自我介紹
document.getElementById("profileIntroduction").value =
  Array.isArray(myProfile.paragraphs)
    ? myProfile.paragraphs.join("\n")
    : "";

// 載入擅長技術
document.getElementById("profileSpecialties").value =
  Array.isArray(myProfile.specialties)
    ? myProfile.specialties.join("、")
    : "";
  document.getElementById("profilePhilosophy").value =
    myProfile.philosophy || "";

  document.getElementById("profileExperience").value =
    myProfile.experience || "";

  document.getElementById("profileInstagram").value =
    myProfile.instagram_url || "";

  document.getElementById("profileLine").value =
    myProfile.line_url || "";

  document.getElementById("profileForm")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const saveButton = document.getElementById("saveProfileBtn");
      const saveMessage = document.getElementById("profileSaveMessage");

      saveButton.disabled = true;
      saveMessage.textContent = "正在儲存個人資料...";

      try {
// 將自我介紹轉換成陣列
const paragraphs = document
  .getElementById("profileIntroduction")
  .value
  .split("\n")
  .map(text => text.trim())
  .filter(Boolean);

// 將擅長技術轉換成陣列
const specialties = document
  .getElementById("profileSpecialties")
  .value
  .split(/[,，、\n]/)
  .map(text => text.trim())
  .filter(Boolean);

// 儲存設計師個人資料
const { error } = await client.rpc(
  "update_my_stylist_profile",
  {
    p_philosophy: document.getElementById("profilePhilosophy").value,
    p_experience: document.getElementById("profileExperience").value,
    p_instagram_url: document.getElementById("profileInstagram").value,
    p_line_url: document.getElementById("profileLine").value,
    p_paragraphs: paragraphs,
    p_specialties: specialties
  }
);

        if (error) throw error;

        saveMessage.textContent = "✅ 個人資料儲存成功！";
        saveMessage.className = "success";
      } catch (error) {
        saveMessage.textContent = "❌ 儲存失敗：" + error.message;
        saveMessage.className = "error";
      } finally {
        saveButton.disabled = false;
      }
    });
}

// 新增作品表單
const addWorkPanel = document.createElement("section");
addWorkPanel.style.marginTop = "30px";

addWorkPanel.innerHTML = `
  <h2>新增我的作品</h2>

  <form id="addWorkForm">
    <p>
      <label>作品名稱</label><br>
      <input
        id="workTitle"
        type="text"
        placeholder="例如：霧感奶茶灰棕"
        required
      >
    </p>

    <p>
      <label>作品分類</label><br>
      <select id="workCategory">
        <option value="color">染髮</option>
        <option value="bleach">漂髮</option>
        <option value="perm">燙髮</option>
        <option value="straightening">縮毛矯正</option>
        <option value="extensions">接髮</option>
        <option value="cut">剪髮</option>
      </select>
    </p>

    <p>
      <label>作品介紹</label><br>
      <textarea
        id="workDescription"
        placeholder="介紹這次的髮型作品"
        rows="4"
      ></textarea>
    </p>
<p>
  <label for="workPhotos">作品照片</label><br>
  <input
    type="file"
    id="workPhotos"
    accept="image/jpeg,image/png,image/webp"
    multiple
  >
  <small>可從手機相簿選擇多張照片</small>
</p>
<button type="submit" id="saveWorkBtn">
  儲存草稿
</button>
  </form>
`;

worksPanel.after(addWorkPanel);
            // 顯示作品儲存結果
const saveMessage = document.createElement("p");
saveMessage.id = "saveMessage";
saveMessage.setAttribute("role", "status");
addWorkPanel.appendChild(saveMessage);
            // 儲存設計師作品草稿
document.getElementById("addWorkForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    const form = event.currentTarget;
    const saveButton = document.getElementById("saveWorkBtn");

    const title = document.getElementById("workTitle").value.trim();
    const category = document.getElementById("workCategory").value;
    const description = document.getElementById("workDescription").value.trim();

    if (!title) {
      saveMessage.textContent = "請先輸入作品名稱";
      return;
    }

    saveButton.disabled = true;
    saveMessage.textContent = "正在儲存作品...";

    try {
      // 上傳作品照片
const photoFiles = Array.from(
  document.getElementById("workPhotos").files
);

const uploadedPhotos = [];

for (const file of photoFiles) {
  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    throw new Error("只支援 JPG、PNG、WebP 照片");
  }

if (file.size > 8 * 1024 * 1024) {
  throw new Error("每張照片不能超過 8MB");
}

  saveMessage.textContent = "正在上傳照片：" + file.name;

  const extension = file.name.split(".").pop().toLowerCase();

  const filePath =
    "works/" +
    account.stylist_id +
    "/" +
    crypto.randomUUID() +
    "." +
    extension;

  const { error: uploadError } = await client.storage
    .from("media")
    .upload(filePath, file, {
      contentType: file.type,
      upsert: false
    });

  if (uploadError) {
    throw uploadError;
  }

  const { data: urlData } = client.storage
    .from("media")
    .getPublicUrl(filePath);

  uploadedPhotos.push({
  path: filePath,
  alt: title,
  crop: "center"
});
}
      const { error } = await client
        .from("works")
.insert({
  slug: "work-" + crypto.randomUUID(),
  title: title,
  category: category,
  description: description,
  stylist_id: account.stylist_id,
  status: "draft",
  featured_status: "none",
  photos: uploadedPhotos
});

      if (error) {
        throw error;
      }

      saveMessage.textContent = "✅ 作品草稿儲存成功！重新整理頁面即可查看。";
      form.reset();

    } catch (error) {
      saveMessage.textContent =
        "❌ 儲存失敗：" + error.message;

    } finally {
      saveButton.disabled = false;
    }
  });
const { data: myWorks, error: worksError } =
  await client
    .from("works")
.select(`
  id,
  title,
  category,
  description,
  photos,
  status,
  featured_status,
  review_status,
  review_note,
  submitted_at,
  reviewed_at
`)
    .eq("stylist_id", account.stylist_id)
    .order("created_at", { ascending: false });

worksList.replaceChildren();

if (worksError) {
  worksList.textContent = "作品載入失敗：" + worksError.message;
} else if (!myWorks || myWorks.length === 0) {
  worksList.textContent = "目前還沒有作品";
} else {
myWorks.forEach((work) => {
  const item = document.createElement("div");

  item.style.padding = "15px";
  item.style.marginBottom = "12px";
  item.style.border = "1px solid #ddd";
  item.style.borderRadius = "10px";

  const title = document.createElement("p");

const reviewLabels = {
  draft: "⚪ 尚未提交",
  pending: "🟡 等待管理員審核",
  approved: "🟢 已核准",
  rejected: "🔴 已退回修改"
};

const reviewStatus = work.review_status || "draft";

title.textContent =
  (work.title || "未命名作品") +
  "｜" +
  (reviewLabels[reviewStatus] || "⚪ 尚未提交");

if (reviewStatus === "rejected") {
  const reviewMessage = document.createElement("p");

  reviewMessage.style.color = "#b91c1c";
  reviewMessage.style.background = "#fef2f2";
  reviewMessage.style.padding = "12px";
  reviewMessage.style.borderRadius = "8px";

  reviewMessage.textContent =
    "管理員退回原因：" +
    (work.review_note || "未提供原因");

  item.appendChild(reviewMessage);
}

  const editButton = document.createElement("button");

  editButton.type = "button";
  editButton.textContent = "✏️ 編輯作品";

editButton.addEventListener("click", () => {
  // 避免重複開啟編輯表單
  const existingForm = item.querySelector(".edit-work-form");

  if (existingForm) {
    existingForm.remove();
    return;
  }

  const editForm = document.createElement("form");
  editForm.className = "edit-work-form";
  editForm.style.marginTop = "15px";

  const titleLabel = document.createElement("label");
  titleLabel.textContent = "作品名稱";

  const titleInput = document.createElement("input");
  titleInput.type = "text";
  titleInput.required = true;
  titleInput.value = work.title || "";

  const categoryLabel = document.createElement("label");
  categoryLabel.textContent = "作品分類";

  const categorySelect = document.createElement("select");

  const categories = {
    color: "染髮",
    bleach: "漂髮",
    perm: "燙髮",
    straightening: "縮毛矯正",
    extensions: "接髮",
    cut: "剪髮"
  };

  Object.entries(categories).forEach(([value, label]) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    categorySelect.appendChild(option);
  });

  categorySelect.value = work.category || "color";

  const descriptionLabel = document.createElement("label");
  descriptionLabel.textContent = "作品介紹";

  const descriptionInput = document.createElement("textarea");
  descriptionInput.rows = 4;
  descriptionInput.value = work.description || "";

  const saveButton = document.createElement("button");
  saveButton.type = "submit";
  saveButton.textContent = "💾 儲存修改";

  const resultMessage = document.createElement("p");

  [
    titleLabel,
    titleInput,
    document.createElement("br"),
    categoryLabel,
    categorySelect,
    document.createElement("br"),
    descriptionLabel,
    descriptionInput,
    document.createElement("br"),
    saveButton,
    resultMessage
  ].forEach(element => editForm.appendChild(element));

  editForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    saveButton.disabled = true;
    resultMessage.textContent = "正在儲存...";

    try {
      const { data, error } = await client
        .from("works")
        .update({
          title: titleInput.value.trim(),
          category: categorySelect.value,
          description: descriptionInput.value.trim()
        })
        .eq("id", work.id)
        .eq("stylist_id", account.stylist_id)
        .select("id, title, category, description")
        .single();

      if (error) throw error;

      work.title = data.title;
      work.category = data.category;
      work.description = data.description;

      title.textContent =
        (work.title || "未命名作品") +
        "｜" + work.status;

      resultMessage.textContent = "✅ 作品修改成功！";
    } catch (error) {
      resultMessage.textContent =
        "❌ 修改失敗：" + error.message;
    } finally {
      saveButton.disabled = false;
    }
  });

  item.appendChild(editForm);
});

  item.appendChild(title);
  // 顯示作品照片
if (Array.isArray(work.photos) && work.photos.length > 0) {
  const photoGallery = document.createElement("div");

  photoGallery.style.display = "flex";
  photoGallery.style.flexWrap = "wrap";
  photoGallery.style.gap = "10px";
  photoGallery.style.marginBottom = "12px";

work.photos.forEach((photo) => {
  if (!photo.path) return;

  const { data } = client.storage
    .from("media")
    .getPublicUrl(photo.path);

  // 每張照片的獨立容器
  const photoItem = document.createElement("div");

  photoItem.style.display = "flex";
  photoItem.style.flexDirection = "column";
  photoItem.style.alignItems = "center";
  photoItem.style.gap = "6px";

  // 顯示照片
  const img = document.createElement("img");

  img.src = data.publicUrl;
  img.alt = photo.alt || work.title || "作品照片";

  img.style.width = "110px";
  img.style.height = "110px";
  img.style.objectFit = "cover";
  img.style.borderRadius = "8px";

  // 建立移除照片按鈕
  const removePhotoButton = document.createElement("button");

  removePhotoButton.type = "button";
  removePhotoButton.textContent = "🗑️ 移除照片";

  removePhotoButton.style.fontSize = "12px";
  removePhotoButton.style.padding = "6px 10px";

removePhotoButton.addEventListener("click", async () => {
  const confirmed = confirm(
    "確定要從作品「" +
    work.title +
    "」移除這張照片嗎？\n\n" +
    "其他照片及作品內容都會保留。"
  );

  if (!confirmed) return;

  removePhotoButton.disabled = true;
  removePhotoButton.textContent = "正在移除...";

  try {
    // 讀取資料庫中最新的照片清單
    const { data: latestWork, error: readError } = await client
      .from("works")
      .select("photos")
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .single();

    if (readError) throw readError;

    const existingPhotos = Array.isArray(latestWork.photos)
      ? latestWork.photos
      : [];

    // 確認照片仍然存在
    const targetExists = existingPhotos.some(
      (p) => p.path === photo.path
    );

    if (!targetExists) {
      throw new Error("這張照片已不在作品中，請重新整理頁面");
    }

    // 只移除指定照片，保留其他照片
    const updatedPhotos = existingPhotos.filter(
      (p) => p.path !== photo.path
    );

    // 更新 Supabase 作品資料
    const { data: updatedWork, error: updateError } = await client
      .from("works")
      .update({ photos: updatedPhotos })
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .eq("photos", JSON.stringify(latestWork.photos))
      .select("photos")
      .single();

    if (updateError) throw updateError;

    work.photos = updatedWork.photos;

    // 從畫面移除指定照片
    photoItem.remove();

    alert("✅ 照片已成功從作品中移除！");

  } catch (error) {
    alert("❌ 移除失敗：" + error.message);
  } finally {
    removePhotoButton.disabled = false;
    removePhotoButton.textContent = "🗑️ 移除照片";
  }
});

// 建立更換照片按鈕
const replacePhotoButton = document.createElement("button");

replacePhotoButton.type = "button";
replacePhotoButton.textContent = "🔄 更換照片";

replacePhotoButton.style.fontSize = "12px";
replacePhotoButton.style.padding = "6px 10px";

// 建立隱藏的照片選擇欄位
const replacePhotoInput = document.createElement("input");

replacePhotoInput.type = "file";
replacePhotoInput.accept = "image/jpeg,image/png,image/webp";
replacePhotoInput.style.display = "none";

// 點擊更換照片，開啟檔案選擇視窗
replacePhotoButton.addEventListener("click", () => {
  replacePhotoInput.click();
});

// 選擇照片後顯示確認訊息
replacePhotoInput.addEventListener("change", async () => {
  const file = replacePhotoInput.files[0];

  if (!file) return;

  // 確認是否更換
  const confirmed = confirm(
    "確定要將這張照片更換成「" +
    file.name +
    "」嗎？\n\n其他照片及排列順序都會保留。"
  );

  if (!confirmed) {
    replacePhotoInput.value = "";
    return;
  }

  replacePhotoButton.disabled = true;
  replacePhotoButton.textContent = "正在更換...";

  try {
    // 檢查照片格式
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
      throw new Error("只支援 JPG、PNG、WebP 照片");
    }

    // 檢查照片大小
    if (file.size > 8 * 1024 * 1024) {
      throw new Error("照片不能超過 8MB");
    }

    // 建立新照片路徑
    const extension = {
      "image/jpeg": "jpg",
      "image/png": "png",
      "image/webp": "webp"
    }[file.type];

    const filePath =
      "works/" +
      account.stylist_id +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;

    // 上傳新照片
    const { error: uploadError } = await client.storage
      .from("media")
      .upload(filePath, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    // 讀取最新照片清單
    const { data: latestWork, error: readError } = await client
      .from("works")
      .select("photos")
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .single();

    if (readError) throw readError;

    const existingPhotos = Array.isArray(latestWork.photos)
      ? latestWork.photos
      : [];

    // 找到原照片的位置
    const photoIndex = existingPhotos.findIndex(
      (p) => p.path === photo.path
    );

    if (photoIndex === -1) {
      throw new Error("找不到原本的照片，請重新整理頁面");
    }

    // 複製照片清單，避免直接修改原資料
    const updatedPhotos = [...existingPhotos];

    // 只更換指定位置的照片
    updatedPhotos[photoIndex] = {
      ...existingPhotos[photoIndex],
      path: filePath
    };

    // 更新作品照片清單
    const { data: updatedWork, error: updateError } = await client
      .from("works")
      .update({ photos: updatedPhotos })
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .eq("photos", JSON.stringify(latestWork.photos))
      .select("photos")
      .single();

    if (updateError) throw updateError;

    work.photos = updatedWork.photos;

    alert("✅ 照片更換成功！");

    // 重新整理，顯示新照片
    window.location.reload();

  } catch (error) {
    alert("❌ 更換失敗：" + error.message);
  } finally {
    replacePhotoButton.disabled = false;
    replacePhotoButton.textContent = "🔄 更換照片";
    replacePhotoInput.value = "";
  }
});

// 將按鈕加入照片區塊
photoItem.appendChild(img);
photoItem.appendChild(replacePhotoButton);
photoItem.appendChild(removePhotoButton);
photoItem.appendChild(replacePhotoInput);

photoGallery.appendChild(photoItem);
});

  item.appendChild(photoGallery);
}

item.appendChild(editButton);

const reviewStatusValue = work.review_status || "draft";

if (
  reviewStatusValue === "draft" ||
  reviewStatusValue === "rejected"
) {
  const submitReviewButton = document.createElement("button");

  submitReviewButton.type = "button";

  submitReviewButton.textContent =
    reviewStatusValue === "rejected"
      ? "🔄 重新提交管理員審核"
      : "📤 提交管理員審核";

  submitReviewButton.style.marginTop = "12px";
  submitReviewButton.style.width = "100%";
  submitReviewButton.style.padding = "12px";
  submitReviewButton.style.background = "#222";
  submitReviewButton.style.color = "#fff";
  submitReviewButton.style.border = "none";
  submitReviewButton.style.borderRadius = "8px";
  submitReviewButton.style.cursor = "pointer";

  submitReviewButton.addEventListener("click", async () => {
    const confirmed = confirm(
      "確定要將這件作品提交給管理員審核嗎？"
    );

    if (!confirmed) return;

    submitReviewButton.disabled = true;
    submitReviewButton.textContent = "正在提交審核...";

    try {
      const { error } = await client.rpc(
        "submit_work_for_review",
        {
          p_work_id: work.id
        }
      );

      if (error) throw error;

      alert("✅ 作品已成功提交管理員審核！");

      window.location.reload();

    } catch (error) {
      alert("❌ 提交審核失敗：" + error.message);

      submitReviewButton.disabled = false;

      submitReviewButton.textContent =
        reviewStatusValue === "rejected"
          ? "🔄 重新提交管理員審核"
          : "📤 提交管理員審核";
    }
  });

  item.appendChild(submitReviewButton);
}

// 建立新增照片功能
const addPhotoPanel = document.createElement("div");
addPhotoPanel.style.marginTop = "12px";

const addPhotoInput = document.createElement("input");
addPhotoInput.type = "file";
addPhotoInput.accept = "image/jpeg,image/png,image/webp";
addPhotoInput.multiple = true;

const addPhotoButton = document.createElement("button");
addPhotoButton.type = "button";
addPhotoButton.textContent = "➕ 新增照片";
addPhotoButton.style.marginLeft = "10px";

const addPhotoMessage = document.createElement("p");
addPhotoMessage.setAttribute("role", "status");

addPhotoButton.addEventListener("click", async () => {
  const files = Array.from(addPhotoInput.files);

  if (!files.length) {
    addPhotoMessage.textContent = "請先選擇照片";
    return;
  }

  addPhotoButton.disabled = true;

  const uploadedPhotos = [];

  try {
    // 檢查照片格式與大小
    for (const file of files) {
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        throw new Error("只支援 JPG、PNG、WebP 照片");
      }

      if (file.size > 8 * 1024 * 1024) {
        throw new Error("每張照片不能超過 8MB");
      }
    }

    // 上傳照片到 Supabase Storage
    for (const file of files) {
      addPhotoMessage.textContent = "正在上傳：" + file.name;

      const extension = file.name.split(".").pop().toLowerCase();

      const filePath =
        "works/" +
        account.stylist_id +
        "/" +
        crypto.randomUUID() +
        "." +
        extension;

      const { error: uploadError } = await client.storage
        .from("media")
        .upload(filePath, file, {
          contentType: file.type,
          upsert: false
        });

      if (uploadError) throw uploadError;

      uploadedPhotos.push({
        path: filePath,
        alt: work.title || "",
        crop: "center"
      });
    }

    // 重新讀取最新照片資料
    const { data: latestWork, error: readError } = await client
      .from("works")
      .select("photos")
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .single();

    if (readError) throw readError;

    const existingPhotos = Array.isArray(latestWork.photos)
      ? latestWork.photos
      : [];

    // 保留舊照片，加入新照片
    const updatedPhotos = [
      ...existingPhotos,
      ...uploadedPhotos
    ];

    // 更新作品照片
    const { data: updatedWork, error: updateError } = await client
      .from("works")
      .update({ photos: updatedPhotos })
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .select("photos")
      .single();

    if (updateError) throw updateError;

    work.photos = updatedWork.photos;

    addPhotoMessage.textContent =
      "✅ 成功新增 " + uploadedPhotos.length + " 張照片！";

    addPhotoInput.value = "";

    // 重新整理以顯示新照片
    setTimeout(() => {
      window.location.reload();
    }, 1200);

  } catch (error) {
    addPhotoMessage.textContent =
      "❌ 上傳失敗：" + error.message;
  } finally {
    addPhotoButton.disabled = false;
  }
});

addPhotoPanel.appendChild(addPhotoInput);
addPhotoPanel.appendChild(addPhotoButton);
addPhotoPanel.appendChild(addPhotoMessage);

item.appendChild(addPhotoPanel);

const deleteButton = document.createElement("button");

deleteButton.type = "button";
deleteButton.textContent = "🗑️ 刪除作品";

deleteButton.style.marginLeft = "10px";
deleteButton.style.backgroundColor = "#b91c1c";
deleteButton.style.color = "white";

deleteButton.addEventListener("click", async () => {
  const confirmed = confirm(
    "確定要刪除作品「" + work.title +
    "」嗎？\n\n刪除後將無法從作品列表復原！"
  );

  if (!confirmed) return;

  deleteButton.disabled = true;
  deleteButton.textContent = "正在刪除...";

  try {
    const { data, error } = await client
      .from("works")
      .delete()
      .eq("id", work.id)
      .eq("stylist_id", account.stylist_id)
      .select("id");

    if (error) throw error;

    if (!data || data.length !== 1) {
      throw new Error("找不到可刪除的作品，請確認帳號權限");
    }

    item.remove();

    if (!worksList.children.length) {
      worksList.textContent = "目前還沒有作品";
    }

    alert("✅ 作品已成功刪除！");
  } catch (error) {
    alert("❌ 刪除失敗：" + error.message);
  } finally {
    deleteButton.disabled = false;
    deleteButton.textContent = "🗑️ 刪除作品";
  }
});

item.appendChild(deleteButton);
worksList.appendChild(item);
});

            message.textContent =
              error.message || "登入失敗，請稍後再試";

          } finally {
