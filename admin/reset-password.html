
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>重設密碼 | HD Hope Hair Salon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f6f5;
      color: #222;
      font-family: Arial, "Noto Sans TC", sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px 30px;
      border: 1px solid #e5e5e5;
    }
    .brand {
      letter-spacing: 4px;
      font-size: 19px;
      margin-bottom: 36px;
    }
    h1 { font-size: 24px; font-weight: 500; }
    p { color: #777; line-height: 1.8; }
    label { display: block; margin-top: 22px; }
    input {
      width: 100%;
      padding: 14px;
      margin-top: 9px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      background: #222;
      color: white;
      border: 0;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #message { font-size: 14px; }
    a { color: #222; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">HD HOPE</div>
    <h1>設定新密碼</h1>
    <p>請為 HD Hope 後台設定新的登入密碼。</p>

    <form id="resetForm">
      <label for="password">新密碼</label>
      <input id="password" type="password"
             minlength="8" autocomplete="new-password"
             required>

      <label for="confirm">確認新密碼</label>
      <input id="confirm" type="password"
             minlength="8" autocomplete="new-password"
             required>

      <button id="submitBtn" type="submit" disabled>
        更新密碼
      </button>
    </form>

    <p id="message">正在驗證重設密碼連結...</p>
    <p><a href="./">返回後台登入</a></p>
  </main>

  <script src="./config.js"></script>
  <script>
    (function () {
      "use strict";

      const config = window.HD_CONFIG || {};
      const form = document.getElementById("resetForm");
      const button = document.getElementById("submitBtn");
      const message = document.getElementById("message");

      const hash = new URLSearchParams(
        window.location.hash.slice(1)
      );
      const query = new URLSearchParams(
        window.location.search
      );

      const token = hash.get("access_token") ||
                    query.get("access_token");
      const type = hash.get("type") || query.get("type");

      // 移除網址上的敏感資訊
      history.replaceState(
        null, "",
        window.location.pathname
      );

      function show(text) {
        message.textContent = text;
      }

      if (!config.SUPABASE_URL ||
          !config.SUPABASE_ANON_KEY) {
        show("網站尚未完成 Supabase 設定，請聯絡管理員。");
        return;
      }

      if (!token || (type && type !== "recovery")) {
        show("重設連結無效或不受支援。請返回後台重新申請。");
        return;
      }

      button.disabled = false;
      show("連結已讀取，請輸入至少 8 個字元的新密碼。");

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password =
          document.getElementById("password").value;
        const confirm =
          document.getElementById("confirm").value;

        if (password.length < 8) {
          show("密碼至少需要 8 個字元。");
          return;
        }

        if (password !== confirm) {
          show("兩次輸入的密碼不一致。");
          return;
        }

        button.disabled = true;
        show("正在更新密碼...");

        try {
          const base = config.SUPABASE_URL.replace(/\/$/, "");
          const response = await fetch(
            base + "/auth/v1/user",
            {
              method: "PUT",
              headers: {
                "apikey": config.SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ password: password })
            }
          );

          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              result.msg ||
              result.message ||
              result.error_description ||
              "連結可能已過期，請重新申請。"
            );
          }

          form.hidden = true;
          show("密碼更新成功！現在可以返回後台登入。");
        } catch (error) {
          show("更新失敗：" + error.message);
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
