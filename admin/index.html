<!DOCTYPE html>
<html lang="zh-Hant-TW" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>後台管理｜HD Hope Hair Salon</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body class="admin-body">

<div id="login" class="login-shell">
  <div class="login-card">
    <div class="brand">HD HOPE HAIR SALON</div>
    <h1>後台登入</h1>
    <p class="small">以管理員帳號登入後，即可新增設計師、上傳作品照片並發布到官網。</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="err-inline" id="loginErr" hidden></div>
      <button class="btn" type="submit" id="loginBtn">登入</button>
      <button class="btn btn--ghost btn--sm" type="button" id="forgotBtn">忘記密碼</button>
    </form>
    <p class="login-note" id="setupNote" hidden>尚未設定 Supabase。<br>請先開啟 <code>admin/config.js</code> 填入專案網址與 anon key，並執行過 <code>supabase/schema.sql</code>。</p>
    <p class="login-note">登入狀態由 Supabase 伺服器驗證，密碼不會存在這個瀏覽器。連續登入失敗會被 Supabase 暫時鎖定。</p>
  </div>
</div>

<div id="app" hidden>
  <div class="shell">
    <aside class="side" id="side">
      <div class="logo">HD HOPE · CMS</div>
      <div class="who"><b id="whoEmail">—</b><span id="whoMeta">管理員</span></div>
      <nav id="nav" style="display:grid;gap:4px"></nav>
      <div class="spacer"></div>
      <button class="out" id="logoutBtn" type="button">登出</button>
    </aside>
    <main class="main">
      <div class="topbar">
        <button class="burger" id="burgerBtn" type="button" aria-label="選單">☰</button>
        <div>
          <div class="crumb" id="crumb">DASHBOARD</div>
          <h1 id="pageTitle">總覽</h1>
        </div>
        <div class="grow"></div>
        <a class="btn btn--ghost btn--sm" href="../index.html" target="_blank" rel="noopener">看官網</a>
      </div>
      <div class="content"><div class="view" id="view"></div></div>
    </main>
  </div>
  <div class="drawer-bg" id="drawerBg"></div>
  <div class="editor" id="editor" aria-hidden="true"></div>
  <div class="toast-stack" id="toasts"></div>
</div>

<script src="./config.js"></script>
<script src="./assets/js/admin.js"></script>
</body>
</html>
